<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070f" />
    <title>Sistema solar de skills</title>
    <meta name="description" content="Explora mis skills y proyectos en un sistema solar interactivo: cada planeta es una categoría y cada luna una skill." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Twitter (TODO: ajusta el título con tu nombre) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Sistema solar de skills" />
    <meta property="og:description" content="Cada planeta es una categoría, cada luna una skill y cada estación un proyecto. Explóralo en 3D." />
    <meta property="og:url" content="https://SergioMaje.github.io/space-portfolio/" />
    <meta property="og:image" content="https://SergioMaje.github.io/space-portfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Escena 3D -->
    <div id="stage" role="img" aria-label="Sistema solar interactivo de skills. Usa la barra de planetas para navegar con teclado."></div>

    <!-- Barra de planetas (accesible con teclado y táctil) -->
    <header class="topbar">
      <h1 class="brand">Sistema solar <span>de skills</span></h1>
      <nav id="planet-nav" aria-label="Planetas"></nav>
    </header>

    <button id="back" class="btn back" type="button" hidden>← Volver al sistema</button>
    <p id="hint" class="hint">Arrastra para rotar · rueda o pellizco para zoom · toca un planeta</p>

    <div id="tooltip" role="tooltip" hidden></div>

    <!-- Panel lateral (bottom sheet en pantallas pequeñas) -->
    <aside id="panel" aria-hidden="true" inert>
      <button id="panel-close" class="icon-btn" type="button" aria-label="Cerrar panel">×</button>
      <div id="panel-body"></div>
    </aside>

    <!-- Carga -->
    <div id="loader" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Cargando sistema solar…</p>
    </div>

    <!-- Alternativa sin WebGL -->
    <main id="fallback" hidden></main>

    <noscript><p class="noscript">Esta página necesita JavaScript para mostrar la simulación.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
